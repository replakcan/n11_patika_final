spring.application.name=config-server
server.port=8888

spring.profiles.active=native
spring.cloud.config.server.native.search-locations=${CONFIG_REPO_PATH:file:../../config-repo,file:../config-repo,file:./config-repo}

eureka.client.service-url.defaultZone=${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka}
eureka.instance.hostname=${EUREKA_HOSTNAME:localhost}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
