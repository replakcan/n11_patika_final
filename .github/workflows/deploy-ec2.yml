name: Deploy To EC2

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: Git ref to deploy
        required: true
        default: main
      image_tag:
        description: Image tag to deploy
        required: true
        default: latest

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  PARAMETER_PATH: ${{ vars.SSM_PARAMETER_PATH }}
  EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
  ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
  APP_DIR: ${{ vars.EC2_APP_DIR }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_GITHUB_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Trigger remote deploy
        id: send-command
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${EC2_INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy n11-patika" \
            --parameters commands="cd ${APP_DIR} && AWS_REGION=${AWS_REGION} PARAMETER_PATH=${PARAMETER_PATH} ECR_REGISTRY=${ECR_REGISTRY} GIT_REF=${{ inputs.git_ref }} IMAGE_TAG_OVERRIDE=${{ inputs.image_tag }} bash deploy/ec2/deploy.sh" \
            --query 'Command.CommandId' \
            --output text)
          echo "command_id=${COMMAND_ID}" >> "$GITHUB_OUTPUT"

      - name: Wait for command result
        run: |
          for _ in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "${{ steps.send-command.outputs.command_id }}" \
              --instance-id "${EC2_INSTANCE_ID}" \
              --query 'Status' \
              --output text)
            if [ "${STATUS}" = "Success" ]; then
              aws ssm get-command-invocation \
                --command-id "${{ steps.send-command.outputs.command_id }}" \
                --instance-id "${EC2_INSTANCE_ID}" \
                --query 'StandardOutputContent' \
                --output text
              exit 0
            fi
            if [ "${STATUS}" = "Cancelled" ] || [ "${STATUS}" = "Failed" ] || [ "${STATUS}" = "TimedOut" ]; then
              aws ssm get-command-invocation \
                --command-id "${{ steps.send-command.outputs.command_id }}" \
                --instance-id "${EC2_INSTANCE_ID}" \
                --query 'StandardErrorContent' \
                --output text
              exit 1
            fi
            sleep 10
          done
          echo "Timed out waiting for SSM command to finish" >&2
          exit 1
