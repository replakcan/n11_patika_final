name: Build And Push Images

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "frontend/**"
      - "config-repo/**"
      - "docker-compose.yml"
      - ".github/workflows/build-and-push.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
  ECR_REPOSITORY_PREFIX: ${{ vars.ECR_REPOSITORY_PREFIX }}

jobs:
  verify-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test

  verify-backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - cart-service
          - config-server
          - discovery-server
          - order-service
          - payment-service
          - product-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - name: Test ${{ matrix.service }}
        run: ./mvnw test
        working-directory: backend/${{ matrix.service }}

  build-and-push:
    runs-on: ubuntu-latest
    needs:
      - verify-frontend
      - verify-backend
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: discovery-server
            dockerfile: backend/discovery-server/Dockerfile
          - image: config-server
            dockerfile: backend/config-server/Dockerfile
          - image: product-service
            dockerfile: backend/product-service/Dockerfile
          - image: cart-service
            dockerfile: backend/cart-service/Dockerfile
          - image: order-service
            dockerfile: backend/order-service/Dockerfile
          - image: payment-service
            dockerfile: backend/payment-service/Dockerfile
          - image: api-gateway
            dockerfile: backend/api-gateway/Dockerfile
          - image: frontend
            dockerfile: frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_GITHUB_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY_PREFIX }}/${{ matrix.image }}:${{ github.sha }}
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY_PREFIX }}/${{ matrix.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Write image summary
        run: |
          echo "- ${{ matrix.image }} -> ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY_PREFIX }}/${{ matrix.image }}:${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
