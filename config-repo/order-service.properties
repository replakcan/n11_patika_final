server.port=8083

eureka.client.service-url.defaultZone=${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true

spring.datasource.url=${ORDER_DB_URL:jdbc:postgresql://localhost:5432/order_db}
spring.datasource.username=${POSTGRES_USERNAME:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:newpassword}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8085/realms/ecommerce}

product-service.base-url=${PRODUCT_SERVICE_BASE_URL:http://localhost:8081}
cart-service.base-url=${CART_SERVICE_BASE_URL:http://localhost:8082}

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

app.messaging.exchange=${MESSAGING_EXCHANGE:ecommerce.exchange}
app.messaging.stock-reserved-queue=${ORDER_STOCK_RESERVED_QUEUE:order.stock-reserved.queue}
app.messaging.stock-failed-queue=${ORDER_STOCK_FAILED_QUEUE:order.stock-failed.queue}
app.messaging.cart-cleared-queue=${ORDER_CART_CLEARED_QUEUE:order.cart-cleared.queue}
app.messaging.cart-clear-failed-queue=${ORDER_CART_CLEAR_FAILED_QUEUE:order.cart-clear-failed.queue}
app.messaging.order-created-routing-key=${ORDER_CREATED_ROUTING_KEY:order.created}
app.messaging.stock-reserved-routing-key=${STOCK_RESERVED_ROUTING_KEY:stock.reserved}
app.messaging.stock-failed-routing-key=${STOCK_FAILED_ROUTING_KEY:stock.failed}
app.messaging.cart-clear-routing-key=${CART_CLEAR_ROUTING_KEY:cart.clear.requested}
app.messaging.cart-cleared-routing-key=${CART_CLEARED_ROUTING_KEY:cart.cleared}
app.messaging.cart-clear-failed-routing-key=${CART_CLEAR_FAILED_ROUTING_KEY:cart.clear.failed}
app.messaging.stock-release-routing-key=${STOCK_RELEASE_ROUTING_KEY:stock.release.requested}
