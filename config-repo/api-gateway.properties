server.port=8079

eureka.client.service-url.defaultZone=${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

spring.cloud.gateway.server.webmvc.routes[0].id=product-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://product-service
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/products/**

spring.cloud.gateway.server.webmvc.routes[1].id=cart-service
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://cart-service
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/cart/**

spring.cloud.gateway.server.webmvc.routes[2].id=order-service
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://order-service
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/orders/**

spring.cloud.gateway.server.webmvc.routes[3].id=payment-service
spring.cloud.gateway.server.webmvc.routes[3].uri=lb://payment-service
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/api/payments/**
