server.port=8081

# Eureka
eureka.client.service-url.defaultZone=${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true

# PostgreSQL
spring.datasource.url=${PRODUCT_DB_URL:jdbc:postgresql://localhost:5432/product_db}
spring.datasource.username=${POSTGRES_USERNAME:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:newpassword}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8085/realms/ecommerce}

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

app.messaging.exchange=${MESSAGING_EXCHANGE:ecommerce.exchange}
app.messaging.order-created-queue=${PRODUCT_ORDER_CREATED_QUEUE:product.order-created.queue}
app.messaging.stock-release-queue=${PRODUCT_STOCK_RELEASE_QUEUE:product.stock-release.queue}
app.messaging.order-created-routing-key=${ORDER_CREATED_ROUTING_KEY:order.created}
app.messaging.stock-reserved-routing-key=${STOCK_RESERVED_ROUTING_KEY:stock.reserved}
app.messaging.stock-failed-routing-key=${STOCK_FAILED_ROUTING_KEY:stock.failed}
app.messaging.stock-release-routing-key=${STOCK_RELEASE_ROUTING_KEY:stock.release.requested}
